<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Set up Universal Code Agent</title><link rel="stylesheet" href="/app.css">
<style>main{padding-bottom:40px}.step{display:flex;gap:12px}.num{flex:none;width:30px;height:30px;border-radius:99px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-weight:700}
.step.done .num{background:var(--ok);color:#06210f;border-color:var(--ok)}.copy{display:flex;gap:8px;align-items:stretch;margin:8px 0}.copy code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;font:13px ui-monospace,Menlo,monospace}
a.btn{display:inline-block;text-decoration:none;padding:12px 16px;border-radius:10px;background:var(--accent);color:#fff;min-height:44px}.warn{color:var(--warn)}</style></head>
<body><header><div class="brand"><span class="logo">&lt;/&gt;</span><span>Setup</span></div><span id="st" class="pill off">checking</span></header>
<main id="m"><div class="card muted">Loading...</div></main>
<script src="/setup.js"></script></body></html>
